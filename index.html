<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBLA APPS - about us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1120;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
            border: 1px solid #334155;
        }
        .header-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .content {
            padding: 30px 20px;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            margin: 0 0 20px 0;
            font-size: 15px;
        }
        .links a {
            display: block;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Tutaj wstawiamy wygenerowany banner -->
        <img src="Webla-apps-header.jpg" alt="Webla Apps" class="header-img">
        
        <div class="content">
            <h1>Webla Apps</h1>
            <p>Tworzenie nowoczesnych aplikacji i stron www</p>
            <div class="links">
                <a href="mailto:info@webla.pl">Napisz do nas na info@webla.pl</a>
                <a href="https://www.linkedin.com/in/maciej-ladkowski-it-manager/" target="_blank">LinkedIn</a>
                <a href="https://github.com/Webla-app" target="_blank">GitHub</a>
            </div>
        </div>
    </div>

</body>
</html>
